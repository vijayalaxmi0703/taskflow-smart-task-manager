{% extends "base.html" %}
{% block title %}Register | TaskFlow{% endblock %}
{% block content %}
<main class="auth-layout">
    <section class="auth-panel">
        <div class="auth-brand">
            <span class="brand-chip">College Assignment Project</span>
            <h1>Create your TaskFlow account</h1>
            <p>Build better habits with a focused dashboard, realtime updates, and analytics-backed progress.</p>
        </div>
        <form class="glass-form" action="{{ url_for('auth.register_post') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>
                <span>Username</span>
                <input type="text" name="username" placeholder="Your name" required>
            </label>
            <label>
                <span>Email</span>
                <input type="email" name="email" placeholder="you@example.com" required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="Create a strong password" required>
            </label>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
        <p class="auth-foot">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></p>
    </section>
</main>
{% endblock %}
